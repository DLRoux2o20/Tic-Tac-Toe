<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>

		<script
			src="https://kit.fontawesome.com/3a1a862694.js"
			crossorigin="anonymous"
		></script>
		<title>Tic Tac Toe</title>
	</head>
	<body>
		<form>
			<i class="fa-solid fa-x" id="form-x1"></i
			><i class="fa-solid fa-x" id="form-x2"></i
			><i class="fa-solid fa-x" id="form-x3"></i
			><i class="fa-solid fa-x" id="form-x4"></i
			><i class="fa-solid fa-x" id="form-x5"></i
			><i class="fa-solid fa-x" id="form-x6"></i>

			<i class="fa-solid fa-o" id="form-o1"></i
			><i class="fa-solid fa-o" id="form-o2"></i
			><i class="fa-solid fa-o" id="form-o3"></i
			><i class="fa-solid fa-o" id="form-o4"></i
			><i class="fa-solid fa-o" id="form-o5"></i
			><i class="fa-solid fa-o" id="form-o6"></i>
			<div id="main-form-div">
				<h2>Tic Tac Toe</h2>
				<div class="flex background-red" id="form-input-container">
					<div class="flex" id="form-input-div">
						<label for="name">Enter player 1 name</label
						><input
							type="text"
							class="input-blue"
							id="name"
							maxlength="20"
							autocomplete="off"
							required
						/>
						<button id="form-button" type="submit">Submit</button>
					</div>
				</div>
			</div>
		</form>
		<section class="hidden">
			<div class="flex" id="header">
				<div class="grid header-child" id="player1-div">
					<div class="header-child-text-div">
						<p class="header-child-text" id="player1-name"></p>
					</div>
					<div class="header-child-icon-div">
						<i class="fa-solid fa-x header-child-icon" id="player1-marker"></i>
					</div>
					<span class="header-child-score" id="player1-score">0</span>
				</div>
				<div class="grid header-child" id="player2-div">
					<div class="header-child-icon-div">
						<i class="fa-solid fa-o header-child-icon" id="player2-marker"></i>
					</div>
					<div class="header-child-text-div">
						<p class="header-child-text" id="player2-name"></p>
					</div>
					<span class="header-child-score" id="player2-score">0</span>
				</div>
			</div>
			<div class="grid wrapper" id="wrapper">
				<div class="flex tile" data-index="0" data-row-index="0"></div>
				<div class="flex tile" data-index="1" data-row-index="0"></div>
				<div class="flex tile" data-index="2" data-row-index="0"></div>
				<div class="flex tile" data-index="0" data-row-index="1"></div>
				<div class="flex tile" data-index="1" data-row-index="1"></div>
				<div class="flex tile" data-index="2" data-row-index="1"></div>
				<div class="flex tile" data-index="0" data-row-index="2"></div>
				<div class="flex tile" data-index="1" data-row-index="2"></div>
				<div class="flex tile" data-index="2" data-row-index="2"></div>
			</div>
		</section>
		<div class="flex hidden" id="end-screen">
			<div class="flex" id="end-screen-content-wrapper">
				<h3>Duan Won!</h3>
				<div class="flex" id="end-screen-buttons-div">
					<button
						class="end-screen-button"
						id="next-round-button"
						type="button"
					>
						Next Round
					</button>
					<button
						class="end-screen-button"
						id="restart-game-button"
						type="button"
					>
						Restart Game
					</button>
				</div>
			</div>
		</div>
		<script src="main.js"></script>
	</body>
</html>
